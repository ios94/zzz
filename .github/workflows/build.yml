name: Build AshteMobile IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies (Zsign, IDeviceKit)
        run: |
          [ -d Zsign ] || git clone --depth 1 -b package https://github.com/khcrysalis/Zsign-Package Zsign
          [ -d IDeviceKitten ] || git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten
          rm -rf Zsign/.git IDeviceKitten/.git

      - name: Use local IDevice framework (avoid SwiftPM binary download bug)
        run: |
          # The old working project used a LOCAL IDevice.xcframework (no download).
          # The cloned IDeviceKit downloads it from GitHub and SwiftPM fails with
          # "artifact ... already exists in file system". Download it ourselves with curl
          # and point Package.swift to the local copy.
          python3 - <<'PY'
          import re, subprocess, os
          pkg = "IDeviceKitten/Package.swift"
          src = open(pkg, encoding="utf-8").read()
          pat = re.compile(r'\.binaryTarget\(\s*name:\s*"([^"]+)"\s*,\s*url:\s*"([^"]+)"\s*,\s*checksum:\s*"[^"]+"\s*\)', re.S)
          os.makedirs("IDeviceKitten/Frameworks", exist_ok=True)
          def fix(m):
              name, url = m.group(1), m.group(2)
              print("Downloading", name, "from", url)
              zp = "/tmp/" + name + ".zip"
              subprocess.check_call(["curl", "-fSL", "--retry", "3", "-o", zp, url])
              subprocess.check_call(["unzip", "-q", "-o", zp, "-d", "IDeviceKitten/Frameworks"])
              return '.binaryTarget(name: "%s", path: "Frameworks/%s.xcframework")' % (name, name)
          new, n = pat.subn(fix, src)
          open(pkg, "w", encoding="utf-8").write(new)
          print("Patched binary targets:", n)
          PY
          echo "---- Package.swift ----"
          cat IDeviceKitten/Package.swift
          echo "---- Frameworks ----"
          ls -la IDeviceKitten/Frameworks

      - name: Select Xcode 26.2 (same as the old working project)
        run: |
          ls /Applications | grep -i "^Xcode" || true
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Remove stale package pins
        run: |
          # pins that are not used by the project anymore (LicensePlist + its dependencies)
          STALE='["licenseplist","apikit","yams","xcodeedit","heliumlogger","loggerapi","swift-html-entities","swift-argument-parser"]'
          for f in $(find . -name Package.resolved -not -path "./.build/*"); do
            jq --argjson s "$STALE" '.pins |= map(select(.identity as $i | ($s | index($i)) | not)) | del(.originHash)' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            echo "cleaned $f"
          done

      - name: Resolve packages
        run: |
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project AshteMobile.xcodeproj -scheme AshteMobile -skipPackagePluginValidation && break
            echo "resolve attempt $i failed, retrying..."
            sleep 5
          done

      - name: Build
        run: |
          # Xcode sometimes crashes while registering packages (Abort trap: 6); a retry fixes it.
          for i in 1 2 3; do
            # SwiftPM can fail with "artifact ... already exists in file system" for the
            # IDevice binary package. Clearing its artifact cache before every attempt fixes it.
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
            make && exit 0
            echo "build attempt $i failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AshteMobile-ipa
          path: packages/*.ipa
