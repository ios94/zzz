name: Build AshteMobile IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies (Zsign, IDeviceKit)
        run: |
          [ -d Zsign ] || git clone --depth 1 -b package https://github.com/khcrysalis/Zsign-Package Zsign
          [ -d IDeviceKitten ] || git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten
          rm -rf Zsign/.git IDeviceKitten/.git

      - name: Select Xcode 26.2 (same as the old working project)
        run: |
          ls /Applications | grep -i "^Xcode" || true
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Remove stale package pins
        run: |
          # pins that are not used by the project anymore (LicensePlist + its dependencies)
          STALE='["licenseplist","apikit","yams","xcodeedit","heliumlogger","loggerapi","swift-html-entities","swift-argument-parser"]'
          for f in $(find . -name Package.resolved -not -path "./.build/*"); do
            jq --argjson s "$STALE" '.pins |= map(select(.identity as $i | ($s | index($i)) | not)) | del(.originHash)' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            echo "cleaned $f"
          done

      - name: Resolve packages
        run: |
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project AshteMobile.xcodeproj -scheme AshteMobile -skipPackagePluginValidation && break
            echo "resolve attempt $i failed, retrying..."
            sleep 5
          done

      - name: Build
        run: |
          # Xcode sometimes crashes while registering packages (Abort trap: 6); a retry fixes it.
          for i in 1 2 3; do
            # SwiftPM can fail with "artifact ... already exists in file system" for the
            # IDevice binary package. Clearing its artifact cache before every attempt fixes it.
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
            make && exit 0
            echo "build attempt $i failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AshteMobile-ipa
          path: packages/*.ipa
